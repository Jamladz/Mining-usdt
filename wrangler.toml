name = "usdt-miner-backend"
main = "cloudflare-worker.ts"
compatibility_date = "2024-09-23"

# Required for firebase-admin and node:crypto
compatibility_flags = ["nodejs_compat"]

[build]
# Prevent wrangler from complaining about unresolved Node built-ins 
# when it bundles the code
command = ""

# Do not put actual secrets here! 
# Use `wrangler secret put <NAME>` to set these in your Cloudflare dashboard
#
# Required Secrets:
# - TELEGRAM_BOT_TOKEN
# - FIREBASE_PROJECT_ID
# - FIREBASE_CLIENT_EMAIL
# - FIREBASE_PRIVATE_KEY
