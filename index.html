    <script>
      // Prevent sandboxed iframe ad-blocker or cross-origin errors from breaking the main React thread
      window.onerror = function(message, source, lineno, colno, error) {
        const src = String(source || '');
        const msg = String(message || '');
        if (
          src.includes('adsgram') || 
          src.includes('libtl') || 
          src.includes('monetag') || 
          msg.includes('cross-origin') || 
          msg.includes('Script error') ||
          msg.includes('SecurityError')
        ) {
          console.warn('Safely caught and ignored cross-origin/sandbox script error:', msg, 'from:', src);
          return true; // Suppress default browser error reporting
        }
        return false;
      };
    </script>
